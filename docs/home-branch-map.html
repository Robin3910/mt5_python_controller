<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>路由 /home功能分支脑图</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161920; --panel-2: #1c2028;
    --text: #e6e8ee; --text-2: #9aa3b2; --text-3: #6b7383;
    --stroke: #262b35; --stroke-2: #323846;
    --accent: #3b82f6; --accent-soft: rgba(59,130,246,0.14);
    --ok: #22c55e; --warn: #f59e0b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #16181d;
      --text-2: #5a6272; --text-3: #8a92a2; --stroke: #e2e5ea; --stroke-2: #cfd4dd;
      --accent: #2563eb; --accent-soft: rgba(37,99,235,0.10);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 24px; margin: 0 0 6px; font-weight: 600; }
  h2 { font-size: 17px; margin: 32px 0 10px; font-weight: 600; }
  .sub { color: var(--text-2); font-size: 13px; margin: 0 0 18px; max-width: 900px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--stroke); border-radius: 8px; padding: 8px 14px; }
  .stat b { display: block; font-size: 18px; font-weight: 600; }
  .stat span { font-size: 11px; color: var(--text-3); }
  .tabs { display: flex; gap: 6px; margin-left: auto; }
  .tab { background: var(--panel); border: 1px solid var(--stroke); color: var(--text-2);
         border-radius: 999px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
  .tab.on { background: var(--accent); border-color: transparent; color: #fff; }
  .note { background: var(--panel); border: 1px solid var(--stroke); border-left: 3px solid var(--accent);
          border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--text-2); margin-bottom: 18px; }
  .note code { color: var(--text); }
  .note strong { color: var(--text); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .panel { background: var(--panel); border: 1px solid var(--stroke); border-radius: 10px; overflow: hidden; }
  .mapwrap { overflow: auto; max-height: 72vh; position: relative; }
  .node { position: absolute; display: flex; align-items: center; gap: 6px; height: 30px;
          padding: 0 8px; border-radius: 6px; font-size: 12px; white-space: nowrap;
          overflow: hidden; cursor: pointer; border: 1px solid var(--stroke); background: var(--panel-2); }
  .node:hover { border-color: var(--accent); }
  .node.l1 { background: var(--panel-2); border-left: 2px solid var(--accent); font-weight: 600; }
  .node.case { background: var(--panel); color: var(--text); }
  .node.sel { outline: 2px solid var(--accent); }
  .toggle { width: 14px; height: 14px; border: 1px solid var(--stroke-2); border-radius: 3px;
            font-size: 10px; display: inline-flex; align-items: center; justify-content: center;
            color: var(--text-2); flex-srink: 0; }
  .toggle:hover { border-color: var(--accent); color: var(--accent); }
  .detail { margin-top: 14px; background: var(--panel); border: 1px solid var(--stroke);
            border-radius: 10px; padding: 14px 16px; }
  .detail h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  .detail dl { margin: 0; display: grid; grid-template-columns: 82px 1fr; gap: 8px 14px; font-size: 13px; }
  .detail dt { color: var(--text-3); font-size: 12px; }
  .detail dd { margin: 0; color: var(--text-2); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--stroke); vertical-align: top; }
  th { color: var(--text-3); font-weight: 600; font-size: 11.5px; position: sticky; top: 0; background: var(--panel-2); }
  td.n { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text-3); white-space: nowrap; }
  .chk { border: 1px solid var(--stroke-2); border-radius: 999px; padding: 2px 10px; font-size: 11px;
         cursor: pointer; color: var(--text-2); background: transparent; white-space: nowrap; }
  .chk.on { background: var(--ok); border-color: transparent; color: #fff; }
  tr.done td { color: var(--text-3); }
  pre { background: var(--panel); border: 1px solid var(--stroke); border-radius: 10px; padding: 16px;
        overflow: auto; font-size: 12.5px; line-height: 1.7; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .src { font-size: 12.5px; color: var(--text-2); }
  .src li { margin: 3px 0; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>首页 /home功能分支脑图</h1>
  <p class="sub">路由 /home，菜单码 home，权限 MENU_HOME；顶栏「首页」入口仅普通用户可见（管理员不显示）</p>

  <div class="bar">
    <div class="stat"><b>67</b><span>可测分支</span></div>
    <div class="stat"><b>10</b><span>一级模块</span></div>
    <div class="tabs">
      <button class="tab on" data-v="map">脑图</button>
      <button class="tab" data-v="list">测试清单</button>
    </div>
  </div>

  <div class="note">路由 /home，菜单码 home，权限 MENU_HOME；顶栏「首页」入口仅普通用户可见（管理员不显示）</div>

  <div id="v-map">
    <div class="panel"><div class="mapwrap" id="map"></div></div>
    <div class="detail" id="detail"></div>
  </div>

  <div id="v-list" class="hide">
    <div class="bar">
      <div class="stat"><b id="prog">0 / 67</b><span>测试进度</span></div>
      <button class="tab" id="clear">清空标记</button>
    </div>
    <div class="panel" style="overflow:auto; max-height:72vh">
      <table>
        <thead><tr>
          <th>编号</th><th>分支</th><th>界面表现</th><th>后端行为</th><th>测试要点</th><th>状态</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <h2>脑图结构</h2>
  <pre id="tree"></pre>
</div>

<script>
const TREE = {"id":"root","label":"首页 /home","kind":"group","ui":"路由 /home，菜单码 home，权限 MENU_HOME；顶栏「首页」入口仅普通用户可见（管理员不显示）","test":"访问 /home 的身份矩阵：普通用户有 home 菜单 / 普通用户无 home 菜单 / 管理员","children":[{"id":"1","label":"① 节点可见范围（homeVisibleNodes）","kind":"group","children":[{"id":"1.1","label":"普通用户 → 全部节点","kind":"case","ui":"不收窄，直接用 hub.nodes 全集","be":"后端 /api/nodes 已按 owner 过滤","test":"普通用户登录后卡片数量应等于 /api/nodes 返回数"},{"id":"1.2","label":"管理员 → 严格 owner == 本人","kind":"case","ui":"只保留 owner_user_id === 当前管理员 user_id 的节点；owner 为空（未分配）一律不展示","be":"「录入者」与「当前所有者」是两个概念，transfer 后 owner 已变","test":"节点 transfer 给用户 B 后，管理员 A 的首页应看不到该节点"},{"id":"1.3","label":"管理员 user_id 缺失","kind":"case","ui":"返回空列表 → 走「你当前没有 owner 为本人的节点」空态","be":"auth.me 未拉到时 myId 为 null","test":"me 接口异常时首页应显示空态而非全部节点"},{"id":"1.4","label":"管理员口径提示条","kind":"case","ui":"仅管理员可见：「首页仅显示所有者为你本人的节点，共 N 个；尚未分配的节点…请在「节点」或「总览」中查看」","be":"—","test":"管理员首页该条应出现，普通用户首页不应出现"},{"id":"1.5","label":"与其它页面的口径差异","kind":"case","ui":"「节点」页 /「总览」页仍能看到未分配节点，只有首页收窄","be":"—","test":"确认三个页面的节点集合口径差异符合预期"}]},{"id":"2","label":"② 趋势观测模块（HubTrendEmbed compact）","kind":"group","children":[{"id":"2.1","label":"默认观测节点","kind":"case","ui":"取第一个在线节点；全离线时退回列表首个","be":"hub.nodes + hub.statuses","test":"把选中的在线节点下线后，应自动切到另一个在线节点"},{"id":"2.2","label":"加载中 / 无节点","kind":"case","ui":"加载中「正在加载节点列表…」；无任何节点「暂无可用节点。请先在「节点」接入至少一个节点后再查看趋势。」","be":"onMounted 并发拉 fetchNodes + fetchTrendConfig","test":"空节点环境下首页趋势区应显示后者文案"},{"id":"2.3","label":"compact 精简模式","kind":"case","ui":"只渲染品种 chips + 周期选择 + 得分条 + K 线卡；参数表单、指标详情卡、RSI 刻度说明、刷新按钮均不渲染","be":"—","test":"首页不应出现「参数」表单与「EMA/RSI 指标详情」两张卡（那是趋势页/节点详情页的内容）"},{"id":"2.4","label":"观察节点选择器","kind":"case","ui":"整块已被注释隐藏——首页无法切换观察节点，只能用默认节点","be":"—","test":"回归确认：首页没有节点下拉选择器"},{"id":"2.5","label":"品种选项来源","kind":"case","ui":"XAUUSD 固定 + quotes 品种 + 持仓品种 + 节点按币种过滤配置里的品种，去重排序；用 chips 平铺","be":"parseNodeDispatchFilters(node.filters)","test":"节点报 3 个品种 + 持仓 1 个 → chips 应含全部去重项"},{"id":"2.6","label":"品种本地记忆","kind":"case","ui":"localStorage 键 trend:hub:symbol:{nodeId}；有记忆则优先恢复，无记忆用 XAUUSD","be":"—","test":"切到 EURUSD 后刷新页面，应仍是 EURUSD；换节点应各自独立记忆"},{"id":"2.7","label":"得分刻度条","kind":"case","ui":"分区宽度随多空阈值（bullish/bearish）变化；指针位置随当前得分；得分 >0 绿、<0 红、=0 不着色；图例显示 -100 / 空头<x / 中性 / 多头>x / +100","be":"scale 计算：at(v) = (v+100)/200","test":"改阈值后分区宽度应随之变化；得分恰好 0 时不应着色"},{"id":"2.8","label":"数据不足提示","kind":"case","ui":"data.ready=false 时显示「已收盘 K 线只有 N 根，不足以算出 EMA(x) 与 RSI(y)，请缩短周期或减小指标周期」；完全无数据时「选择品种后显示趋势得分。」","be":"后端 trend_indicators.evaluate","test":"选一个刚上市的新品种，应命中数据不足分支"},{"id":"2.9","label":"离线节点提示","kind":"case","ui":"节点离线时优先显示「节点当前离线，无法读取实时行情。」，此时不显示 error 文案","be":"online=false 优先于 error","test":"节点离线时应显示离线提示，而不是接口错误"},{"id":"2.10","label":"接口错误提示","kind":"case","ui":"显示后端 detail 或「读取趋势数据失败」","be":"GET /api/nodes/{id}/trend；400 品种代码无效 / 409 行情读取失败","test":"输入非法品种代码应显示后端 detail"},{"id":"2.11","label":"当前价与来源","kind":"case","ui":"≥100 的价格 2 位小数，<100 的 5 位小数；报价缺失时后缀提示「（报价缺失，取收盘价）」","be":"price_source == 'close'","test":"报价缺失的品种应显示收盘价并带该后缀"},{"id":"2.12","label":"K 线图渲染","kind":"case","ui":"上格 K 线 + EMA 线，下格 RSI 线（虚线=超买超卖，点线=偏多偏空）；支持滚轮缩放；ResizeObserver 自适应","be":"GET /api/nodes/{id}/trend 的 bars/ema_series/rsi_series","test":"无 K 线数据时显示「暂无 K 线数据。」"},{"id":"2.13","label":"自动刷新轮询","kind":"case","ui":"默认 3 秒；inflight 去重（上次未回来就跳过）；compact 模式下刷新选项 UI 被注释隐藏，只用默认值","be":"setInterval(load, refreshMs)","test":"网络慢时应看到请求被跳过而非堆积"}]},{"id":"3","label":"③ 汇总统计卡（5 张）","kind":"group","children":[{"id":"3.1","label":"统计口径 = 首页可见列表","kind":"case","ui":"5 张卡的统计基数都是 homeVisibleNodes，不是全量节点","be":"—","test":"管理员名下有他人节点时，合计净值不应包含他人节点的净值"},{"id":"3.2","label":"在线节点","kind":"case","ui":"「在线 N / 总数 M」；在线判定 = hub.statuses[node_id] === 'online' || node.status === 'online'","be":"WS 实时状态优先于 REST 字段","test":"节点上下线后该数字应实时变化"},{"id":"3.3","label":"合计净值","kind":"case","ui":"各节点 equity 之和；千分位分隔、最多 2 位小数","be":"AccountSnapshot.equity，缺失按 0","test":"快照未上报时该值应为 0，不应显示 NaN"},{"id":"3.4","label":"合计持仓 / 合计手数","kind":"case","ui":"持仓 = 各节点 positions.length 之和；手数 = 各节点 positions[].volume 之和","be":"—","test":"多节点多持仓时两者应分别对应笔数与总手数"},{"id":"3.5","label":"合计盈亏","kind":"case","ui":"各节点 positions[].profit 之和；≥0 显示 +X.XX 且卡片转正色，<0 显示 -X.XX 转负色；0 显示 +0","be":"—","test":"盈亏恰好 0 时应显示 +0.00 且用正色"}]},{"id":"4","label":"④ 工具栏（搜索 / 筛选 / 排序）","kind":"group","children":[{"id":"4.1","label":"搜索框","kind":"case","ui":"占位符「搜索节点 / 账号」；不区分大小写；trim 后匹配","be":"—","test":"输入部分节点名应能命中（模糊包含）"},{"id":"4.2","label":"搜索匹配字段","kind":"case","ui":"节点名、node_id、MT5 登录号、MT5 服务器名，四者拼一起做包含匹配","be":"优先取快照的 login / server，回退 node.mt5_login / mt5_server","test":"按登录号搜索与按服务器名搜索都应命中"},{"id":"4.3","label":"状态筛选 chips","kind":"case","ui":"全部 N / 在线 N / 离线 N，数字基于首页可见列表；选中项高亮","be":"—","test":"计数与实际筛出的结果数应一致"},{"id":"4.4","label":"筛选与搜索叠加","kind":"case","ui":"状态筛选与关键词搜索为 AND 关系","be":"—","test":"同时加关键词与状态，应只出两者交集"},{"id":"4.5","label":"排序选项","kind":"case","ui":"按净值降序 / 按净值升序 / 按名称（中文 localeCompare）","be":"—","test":"按名称排序应按中文拼音顺序，不是 Unicode 码点"},{"id":"4.6","label":"主节点始终置顶","kind":"case","ui":"无论选哪种排序，主节点永远排第一","be":"primaryFirst 比较器优先于次级排序","test":"主节点净值最低时，按净值降序也应排第一"},{"id":"4.7","label":"筛选变化重置分页","kind":"case","ui":"搜索词 / 状态 / 排序 任一变化 → 页码重置为 1；总页数减少时页码自动收敛","be":"watch([q, statusFilter, sortBy])","test":"在第 3 页改搜索条件，应回到第 1 页而不是空白"},{"id":"4.8","label":"视图切换按钮","kind":"case","ui":"网格 / 列表切换按钮的模板已被注释隐藏；viewMode 变量保留但固定为 'grid'","be":"—","test":"回归确认：首页没有视图切换按钮"}]},{"id":"5","label":"⑤ 节点卡片","kind":"group","children":[{"id":"5.1","label":"卡片头部","kind":"case","ui":"状态圆点 + 节点名（可点击跳节点详情）+ 在线/离线标签 + 「★ 主节点」标签（仅主节点有）","be":"—","test":"点击节点名应跳到 /nodes/{id}"},{"id":"5.2","label":"账号副标题","kind":"case","ui":"「登录号 @ 服务器」；优先取账户快照，回退节点字段；都缺显示 '— @ —'","be":"—","test":"节点未上报快照时应显示回退值或 —"},{"id":"5.3","label":"三项指标","kind":"case","ui":"净值 / 持仓（N 笔 - X 手）/ 盈亏（带正负号，正绿负红）","be":"—","test":"无持仓节点盈亏应显示 +0.00"},{"id":"5.4","label":"持仓预览表","kind":"case","ui":"整块已被注释隐藏——卡片上不展示持仓明细表与单笔平仓按钮","be":"—","test":"回归确认：卡片上没有持仓明细表"},{"id":"5.5","label":"「查看全部 N const LEAVES = [{"id":"1.1","path":"① 节点可见范围（homeVisibleNodes） › 普通用户 → 全部节点","ui":"不收窄，直接用 hub.nodes 全集","be":"后端 /api/nodes 已按 owner 过滤","test":"普通用户登录后卡片数量应等于 /api/nodes 返回数"},{"id":"1.2","path":"① 节点可见范围（homeVisibleNodes） › 管理员 → 严格 owner == 本人","ui":"只保留 owner_user_id === 当前管理员 user_id 的节点；owner 为空（未分配）一律不展示","be":"「录入者」与「当前所有者」是两个概念，transfer 后 owner 已变","test":"节点 transfer 给用户 B 后，管理员 A 的首页应看不到该节点"},{"id":"1.3","path":"① 节点可见范围（homeVisibleNodes） › 管理员 user_id 缺失","ui":"返回空列表 → 走「你当前没有 owner 为本人的节点」空态","be":"auth.me 未拉到时 myId 为 null","test":"me 接口异常时首页应显示空态而非全部节点"},{"id":"1.4","path":"① 节点可见范围（homeVisibleNodes） › 管理员口径提示条","ui":"仅管理员可见：「首页仅显示所有者为你本人的节点，共 N 个；尚未分配的节点…请在「节点」或「总览」中查看」","be":"—","test":"管理员首页该条应出现，普通用户首页不应出现"},{"id":"1.5","path":"① 节点可见范围（homeVisibleNodes） › 与其它页面的口径差异","ui":"「节点」页 /「总览」页仍能看到未分配节点，只有首页收窄","be":"—","test":"确认三个页面的节点集合口径差异符合预期"},{"id":"2.1","path":"② 趋势观测模块（HubTrendEmbed compact） › 默认观测节点","ui":"取第一个在线节点；全离线时退回列表首个","be":"hub.nodes + hub.statuses","test":"把选中的在线节点下线后，应自动切到另一个在线节点"},{"id":"2.2","path":"② 趋势观测模块（HubTrendEmbed compact） › 加载中 / 无节点","ui":"加载中「正在加载节点列表…」；无任何节点「暂无可用节点。请先在「节点」接入至少一个节点后再查看趋势。」","be":"onMounted 并发拉 fetchNodes + fetchTrendConfig","test":"空节点环境下首页趋势区应显示后者文案"},{"id":"2.3","path":"② 趋势观测模块（HubTrendEmbed compact） › compact 精简模式","ui":"只渲染品种 chips + 周期选择 + 得分条 + K 线卡；参数表单、指标详情卡、RSI 刻度说明、刷新按钮均不渲染","be":"—","test":"首页不应出现「参数」表单与「EMA/RSI 指标详情」两张卡（那是趋势页/节点详情页的内容）"},{"id":"2.4","path":"② 趋势观测模块（HubTrendEmbed compact） › 观察节点选择器","ui":"整块已被注释隐藏——首页无法切换观察节点，只能用默认节点","be":"—","test":"回归确认：首页没有节点下拉选择器"},{"id":"2.5","path":"② 趋势观测模块（HubTrendEmbed compact） › 品种选项来源","ui":"XAUUSD 固定 + quotes 品种 + 持仓品种 + 节点按币种过滤配置里的品种，去重排序；用 chips 平铺","be":"parseNodeDispatchFilters(node.filters)","test":"节点报 3 个品种 + 持仓 1 个 → chips 应含全部去重项"},{"id":"2.6","path":"② 趋势观测模块（HubTrendEmbed compact） › 品种本地记忆","ui":"localStorage 键 trend:hub:symbol:{nodeId}；有记忆则优先恢复，无记忆用 XAUUSD","be":"—","test":"切到 EURUSD 后刷新页面，应仍是 EURUSD；换节点应各自独立记忆"},{"id":"2.7","path":" witch_blocked' → 弹「主节点切换被拦截」警告框，列出阻塞明细（分组/品种/状态/魔术号），超过 20 条折叠为「…（共 N 条）」","be":"路由把 PrimarySwitchBlocked 映射成 409 + detail 对象","test":"预查通过但后端二次拦截时，应弹这个弹窗而不是普通错误 toast"},{"id":"7.7","path":"⑦ 主节点切换流程 › 其它错误提示","ui":"detail 是字符串时直接显示；否则兜底「设置主节点失败」/「取消主节点失败」","be":"—","test":"非本人节点 → 404（owned_node_or_404 不泄露存在性）"},{"id":"7.8","path":"⑦ 主节点切换流程 › 无强制绕过","ui":"路由不接受任何 force 参数——唯一放行条件是「无 in-flight 子任务」","be":"事务外 + 事务内双重校验，挡住极小窗口期新增的任务","test":"管理员也不能强制切换"},{"id":"8.1","path":"⑧ 空态与分页 › 完全无节点（管理员）","ui":"「你当前没有 owner 为本人的节点。请到「节点」页把未分配的节点分配给自己，或新建后再回到首页查看。」","be":"—","test":"管理员名下无节点时应显示这段专属文案"},{"id":"8.2","path":"⑧ 空态与分页 › 完全无节点（普通用户）","ui":"「还没有节点，请到「节点」页面创建。」","be":"—","test":"普通用户无节点时应显示这段文案"},{"id":"8.3","path":"⑧ 空态与分页 › 有节点但筛选后为空","ui":"「没有匹配的节点」；判定条件是首页可见列表非空且筛选结果为空","be":"—","test":"搜索一个不存在的关键词应命中这条，而不是「无节点」"},{"id":"8.4","path":"⑧ 空态与分页 › 分页","ui":"每页 9 个；仅当结果数 > 9 时才显示分页器；页码窗口为当前页 ±2（最多 5 个）","be":"—","test":"10 个节点应出现分页器，9 个不出现"},{"id":"8.5","path":"⑧ 空态与分页 › 分页按钮行为","ui":"‹ 上一页 / › 下一页，首尾页对应按钮 disabled；页码可直接点击跳转","be":"—","test":"首页时 ‹ 应为禁用态"},{"id":"8.6","path":"⑧ 空态与分页 › 结果计数文案","ui":"「节点列表」标题旁显示「N 个结果」（筛选后的数量，不是总数）","be":"—","test":"筛选后计数应同步变化"},{"id":"9.1","path":"⑨ 实时数据来源 › WS 推送刷新","ui":"登录后 App.vue 建立后台 WS；snapshot 消息回填节点状态与账户快照；node_status 推送上下线","be":"applyWs 分发 snapshot / node_status / node_rejected / node_registered 等类型","test":"节点上线时首页卡片状态应在秒级更新"},{"id":"9.2","path":"⑨ 实时数据来源 › 账户快照获取","ui":"首页只 fetchNodes，不单独拉各节点账户；账户数据靠 WS 推送填充 hub.accounts","be":"GET /api/nodes/{id}/account 在 fetchNodeAccount 里，404 静默忽略","test":"刚进首页瞬间指标可能短暂为 0（快照未到），应能自行填充"},{"id":"9.3","path":"⑨ 实时数据来源 › WS 断开兜底","ui":"WS 断开后页面不主动降级为轮询；数值停留在最后一次推送","be":"—","test":"断开后台服务后刷新页面，指标应不再变化"},{"id":"9.4","path":"⑨ 实时数据来源 › 顶栏在线计数","ui":"顶栏「在线 N/M」用 store 的 onlineCount（全量节点口径，非首页可见口径），与首页统计卡口径不同","be":"hub.onlineCount 过滤的是 hub.nodes 全集","test":"确认两个位置的在线数在有他人节点时会不同"},{"id":"10.1","path":"⑩ 权限与访问控制 › 菜单权限 home","ui":"无 home 菜单权限 → 路由守卫重定向到第一个有权限的菜单","be":"router.beforeEach：hasMenu(to.meta.menu) 为假 → firstAllowedPath","test":"去掉 home 权限后访问 /home，应被重定向而不是 403"},{"id":"10.2","path":"⑩ 权限与访问控制 › 管理员不显示首页入口","ui":"顶栏「首页」入口条件是 !auth.isAdmin && hasMenu('home')——管理员导航里根本没有首页","be":"—","test":"管理员登录后顶栏应看不到「首页」入口"},{"id":"10.3","path":"⑩ 权限与访问控制 › 节点归属校验","ui":"平仓、设主节点等操作都要求节点属于本人","be":"owned_node_or_404：非本人节点按不存在处理（404）","test":"普通用户对他人节点操作应 404"},{"id":"10.4","path":"⑩ 权限与访问控制 › 平仓菜单权限","ui":"—","be":"close_node 要求 MENU_NODES 或 MENU_DASHBOARD 任一","test":"两个菜单都没有时平仓应被拒"},{"id":"10.5","path":"⑩ 权限与访问控制 › active-tasks 权限","ui":"—","be":"require_menu(MENU_NODES)，普通用户若无 nodes 权限则预查 403（前端已忽略预查错误）","test":"无 nodes 权限时主节点切换仍能走通（预查失败被吞掉）"}];

const NW = 232, NH = 30, GX = 52, GY = 10;
const nodes = [];
let cursor = 0;
function assign(n, depth) {
  const x = depth * (NW + GX);
  if (!n.children || !n.children.length) {
    nodes.push({ ...n, x, y: cursor, depth });
    cursor += NH + GY;
    return;
  }
  const ys = n.children.map((c) => { assign(c, depth + 1); return nodes.find((q) => q.id === c.id).y; });
  nodes.push({ ...n, x, y: (ys[0] + ys[ys.length - 1]) / 2, depth });
}
assign(TREE, 0);
const W = Math.max(...nodes.map((n) => n.x)) + NW + 24;
const H = Math.max(...nodes.map((n) => n.y)) + NH + 24;

const byId = {};
nodes.forEach((n) => (byId[n.id] = n));
const collapsed = new Set();
let selected = "root";

function visibleList() {
  const hidden = new Set();
  (function walk(n) {
    if (collapsed.has(n.id)) {
      hidden.add(n.id);
      (n.children || []).forEach(walk);
      return;
    }
    (n.children || []).forEach(walk);
  })(TREE);
  return nodes.filter((n) => !hidden.has(n.id));
}

const mapEl = document.getElementById("map");
const detailEl = document.getElementById("detail");

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function draw() {
  const vis = visibleList();
  const visIds = new Set(vis.map((v) => v.id));
  let edges = "";
  for (const n of vis) {
    for (const c of n.children || []) {
      if (!visIds.has(c.id)) continue;
      const cc = byId[c.id];
      const x1 = n.x + NW, y1 = n.y + NH / 2, x2 = cc.x, y2 = cc.y + NH / 2;
      const dx = Math.max(18, (x2 - x1) / 2);
      edges += '<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + y1 + ', ' + (x2 - dx) + ' ' + y2 + ', ' + x2 + ' ' + y2 +
        '" fill="none" stroke="var(--stroke-2)" stroke-width="1"/>';
    }
  }
  let html = '<svg width="' + W + '" height="' + H + '" style="position:absolute;left:0;top:0;pointer-events:none">' + edges + "</svg>";
  for (const n of vis) {
    const kids = (n.children || []).length > 0;
    const cls = "node" + (n.depth === 1 ? " l1" : "") + (n.kind === "case" ? " case" : "") + (n.id === selected ? " sel" : "");
    const t = kids ? '<span class="toggle" data-t="' + n.id + '">' + (collapsed.has(n.id) ? "+" : "−") + "</span>" : "";
    html += '<div class="' + cls + '" style="left:' + n.x + "px;top:" + n.y + 'px;width:' + NW + 'px" data-n="' + n.id + '">' +
      t + "<span>" + escapeHtml(n.label) + "</span></div>";
  }
  mapEl.style.height = H + "px";
  mapEl.innerHTML = html;
  drawDetail();
}

function drawDetail() {
  const n = byId[selected];
  if (!n) { detailEl.innerHTML = ""; return; }
  let h = "<h3>" + escapeHtml(n.label) + "</h3>";
  if (n.ui || n.be || n.test) {
    h += "<dl>";
    if (n.ui) h += "<dt>界面表现</dt><dd>" + escapeHtml(n.ui) + "</dd>";
    if (n.be) h += "<dt>后端行为</dt><dd>" + escapeHtml(n.be) + "</dd>";
    if (n.test) h += "<dt>测试要点</dt><dd>" + escapeHtml(n.test) + "</dd>";
    h += "</dl>";
  } else {
    h += '<p style="margin:0;color:var(--text-3);font-size:13px">这是结构分组节点，请选择具体的分支。</p>';
  }
  detailEl.innerHTML = h;
}

mapEl.addEventListener("click", (e) => {
  const tg = e.target.closest("[data-t]");
  if (tg) {
    const id = tg.getAttribute("data-t");
    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    draw();
    return;
  }
  const nd = e.target.closest("[data-n]");
  if (nd) { selected = nd.getAttribute("data-n"); draw(); }
});

const done = new Set();
const tbody = document.getElementById("tbody");
function drawList() {
  let h = "";
  for (const l of LEAVES) {
    const ok = done.has(l.id);
    h += '<tr class="' + (ok ? "done" : "") + '"><td class="n">' + escapeHtml(l.id) + "</td><td>" + escapeHtml(l.path) +
      "</td><td>" + escapeHtml(l.ui || "—") + "</td><td>" + escapeHtml(l.be || "—") + "</td><td>" + escapeHtml(l.test || "—") +
      '</td><td><button class="chk' + (ok ? " on" : "") + '" data-c="' + l.id + '">' + (ok ? "已测" : "未测") + "</button></td></tr>";
  }
  tbody.innerHTML = h;
  document.getElementById("prog").textContent = done.size + " / " + LEAVES.length;
}
tbody.addEventListener("click", (e) => {
  const b = e.target.closest("[data-c]");
  if (!b) return;
  const id = b.getAttribute("data-c");
  done.has(id) ? done.delete(id) : done.add(id);
  drawList();
});
document.getElementById("clear").addEventListener("click", () => { done.clear(); drawList(); });

document.querySelectorAll(".tab[data-v]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab[data-v]").forEach((b) => b.classList.toggle("on", b === btn));
    const v = btn.getAttribute("data-v");
    document.getElementById("v-map").classList.toggle("hide", v !== "map");
    document.getElementById("v-list").classList.toggle("hide", v !== "list");
  });
});

(function () {
  let out = "";
  (function walk(n, prefix, last, isRoot) {
    out += isRoot ? n.label : prefix + (last ? "└─ " : "├─ ") + n.label + "\n";
    const kids = n.children || [];
    const cp = isRoot ? "" : prefix + (last ? "   " : "│  ");
    kids.forEach((c, i) => walk(c, cp, i === kids.length - 1, false));
  })(TREE, "", true, true);
  document.getElementById("tree").textContent = out;
})();

draw();
drawList();
</script>
