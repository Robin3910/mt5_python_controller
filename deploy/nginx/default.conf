upstream mt5_backend {
    server backend:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    # WebSocket endpoints (node + admin) — require Upgrade handling
    location /ws/ {
        proxy_pass http://mt5_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Client installer upload/download — packages are tens of MB, so the global
    # 1m body limit and default proxy timeouts must be relaxed here only.
    # "^~" is required: without it the ^/(api|...) regex location below wins over
    # this prefix location and the upload falls back to the 1m server limit (413).
    location ^~ /api/client-versions {
        proxy_pass http://mt5_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # HTTP API + webhook + health + docs
    location ~ ^/(api|webhook|health|docs|redoc|openapi.json) {
        proxy_pass http://mt5_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA frontend (built into the nginx image at docker compose build time)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # index.html 不缓存：它引用带 hash 的 /assets/*，本身必须始终取最新，
        # 否则发版后用户会被旧 HTML 卡住（进而拿到旧 chunk 组合 → 白屏）。
        # PWA 独立应用靠它加载 manifest 与 Service Worker，缓存住会导致
        # 「已添加的桌面图标」停留在旧版本。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }

    # ── PWA 清单：绝不能长缓存 ────────────────────────────────────────
    # manifest 决定「桌面图标点开进哪个页面 / 是否独立窗口」。
    # 一旦被浏览器或 CDN 缓存住，用户改了 manifest 也得等缓存过期才生效。
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        # nginx 默认不认识 .webmanifest 后缀（会回落成 application/octet-stream），
        # 这里用 types 块显式声明；不要用 add_header Content-Type，
        # 那样会和默认类型叠加成 "a/b,a/b" 的畸形头。
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── 图标：内容不变（文件名无 hash，但极少变动），允许缓存 ────────────
    location ^~ /icons/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ── 带 hash 的构建产物：永久缓存 ───────────────────────────────────
    # 文件名含内容 hash，内容一变文件名就变，可以放心 immutable。
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

